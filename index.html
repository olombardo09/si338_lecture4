<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My photo lightbox gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="dist/css/lightbox.css" rel="stylesheet" />
</head>
<body>
    <header>
        <h1>My photo lightbox gallery</h1>
    </header>
    <main>
        <div class="grid">
        <a href="images/brazen_food.jpg" data-lightbox="group1">
            <img src="images/brazen_food.jpg" width="200" alt="Dinner plate with two sausages on top of mashed potatoes served with broccoli and vegetable mash">
        </a>
        <a href="images/brown_sugar.jpeg" data-lightbox="group1">
            <img src="images/brown_sugar.jpeg" width="200" alt="A Royal Baking Powder tin filled with brown sugar and a metal spoon sits on a tabletop">
        </a>
        <a href="images/me_and_mia.jpg" data-lightbox="group2">
            <img src="images/me_and_mia.jpg" width="200" alt="Two girls smiling for a photo on a cobblestone street in front of Trinity College Dublin with historic city buildings in the background">
        </a>
        <a href="images/yogurt_bowl.jpeg" data-lightbox="group2">
            <img src="images/yogurt_bowl.jpeg" width="200" alt="Yogurt bowl with nut granola, small mint leave pieces, and peaches on top with a metal spoon on the side">
        </a>
        </div>
    </main>
    <script src="dist/js/lightbox-plus-jquery.js"></script>

</body>
</html>
